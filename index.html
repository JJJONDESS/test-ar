<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; }
      a-scene canvas { touch-action: none; }

      #ui {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 10px;
        z-index: 9999;
      }
      #ui button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background: #ff5a36;
        color: white;
        font-weight: bold;
      }
      #hint {
        position: fixed;
        top: 20px;
        left: 0;
        right: 0;
        text-align: center;
        color: white;
        font-family: sans-serif;
        font-size: 14px;
        text-shadow: 0 0 4px black;
        z-index: 9999;
        pointer-events: none;
      }
    </style>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <div id="hint">Point camera at your marker, then tap "Place Pizza"</div>
    <div id="ui">
      <button id="placeBtn">Place Pizza</button>
      <button id="resetBtn">Reset</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./pizza-target.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="pizzaModel" src="./pizza.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-gltf-model id="trackedPizza" rotation="0 0 0" position="0 0 0.1" scale="3 3 3" src="#pizzaModel">
        </a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      AFRAME.registerComponent('freeform-control', {
        init: function () {
          this.touchMap = new Map();
          this.previousDistance = null;
          this.previousAngle = null;
          this.dragTouchId = null;
          this.lastDragPos = null;

          this.onTouchStart = this.onTouchStart.bind(this);
          this.onTouchMove = this.onTouchMove.bind(this);
          this.onTouchEnd = this.onTouchEnd.bind(this);

          const canvas = this.el.sceneEl.canvas;
          canvas.addEventListener('touchstart', this.onTouchStart, { passive: false });
          canvas.addEventListener('touchmove', this.onTouchMove, { passive: false });
          canvas.addEventListener('touchend', this.onTouchEnd, { passive: false });
          canvas.addEventListener('touchcancel', this.onTouchEnd, { passive: false });

          this.el.object3D.traverse((node) => {
            if (node.isMesh && node.material) {
              const mats = Array.isArray(node.material) ? node.material : [node.material];
              mats.forEach((m) => { m.side = THREE.DoubleSide; });
            }
          });
        },

        remove: function () {
          const canvas = this.el.sceneEl.canvas;
          canvas.removeEventListener('touchstart', this.onTouchStart);
          canvas.removeEventListener('touchmove', this.onTouchMove);
          canvas.removeEventListener('touchend', this.onTouchEnd);
          canvas.removeEventListener('touchcancel', this.onTouchEnd);
        },

        getTouchPair: function () {
          return Array.from(this.touchMap.values());
        },

        getDistance: function (a, b) {
          return Math.hypot(a.x - b.x, a.y - b.y);
        },

        getAngle: function (a, b) {
          return Math.atan2(b.y - a.y, b.x - a.x);
        },

        onTouchStart: function (e) {
          e.preventDefault();
          for (const t of e.changedTouches) {
            this.touchMap.set(t.identifier, { x: t.clientX, y: t.clientY });
          }

          if (this.touchMap.size === 2) {
            const [a, b] = this.getTouchPair();
            this.previousDistance = this.getDistance(a, b);
            this.previousAngle = this.getAngle(a, b);
            this.dragTouchId = null;
            this.lastDragPos = null;
          } else if (this.touchMap.size === 1) {
            const id = this.touchMap.keys().next().value;
            this.dragTouchId = id;
            this.lastDragPos = { ...this.touchMap.get(id) };
            this.previousDistance = null;
            this.previousAngle = null;
          }
        },

        onTouchMove: function (e) {
          e.preventDefault();
          const obj = this.el.object3D;

          for (const t of e.changedTouches) {
            if (this.touchMap.has(t.identifier)) {
              this.touchMap.set(t.identifier, { x: t.clientX, y: t.clientY });
            }
          }

          if (this.touchMap.size === 2 && this.previousDistance !== null) {
            const [a, b] = this.getTouchPair();
            const distance = this.getDistance(a, b);
            const angle = this.getAngle(a, b);

            let scaleFactor = distance / this.previousDistance;
            scaleFactor = Math.min(Math.max(scaleFactor, 0.9), 1.1);

            let newScale = obj.scale.x * scaleFactor;
            newScale = Math.min(Math.max(newScale, 1), 8);
            obj.scale.set(newScale, newScale, newScale);

            let angleDelta = angle - this.previousAngle;
            if (angleDelta > Math.PI) angleDelta -= 2 * Math.PI;
            if (angleDelta < -Math.PI) angleDelta += 2 * Math.PI;
            obj.rotation.y += angleDelta;

            this.previousDistance = distance;
            this.previousAngle = angle;
          } else if (this.touchMap.size === 1 && this.dragTouchId !== null && this.touchMap.has(this.dragTouchId)) {
            const current = this.touchMap.get(this.dragTouchId);
            const dx = current.x - this.lastDragPos.x;
            const dy = current.y - this.lastDragPos.y;
            const moveScale = 0.004;

            obj.position.x += dx * moveScale;
            obj.position.y -= dy * moveScale;

            this.lastDragPos = { ...current };
          }
        },

        onTouchEnd: function (e) {
          for (const t of e.changedTouches) {
            this.touchMap.delete(t.identifier);
          }

          if (this.touchMap.size < 2) {
            this.previousDistance = null;
            this.previousAngle = null;
          }

          if (this.touchMap.size !== 1) {
            this.dragTouchId = null;
            this.lastDragPos = null;
          } else {
            this.dragTouchId = this.touchMap.keys().next().value;
            this.lastDragPos = { ...this.touchMap.get(this.dragTouchId) };
          }
        }
      });

      const sceneEl = document.querySelector('a-scene');
      const placeBtn = document.getElementById('placeBtn');
      const resetBtn = document.getElementById('resetBtn');
      const hint = document.getElementById('hint');
      let freeEntity = null;

      placeBtn.addEventListener('click', () => {
        const targetEl = document.getElementById('target');
        const trackedPizza = document.getElementById('trackedPizza');

        if (!targetEl.object3D.visible) {
          alert('Point your camera at the marker first, then tap Place.');
          return;
        }

        if (freeEntity) return;

        sceneEl.object3D.attach(trackedPizza.object3D);

        freeEntity = trackedPizza;
        freeEntity.setAttribute('freeform-control', '');

        hint.innerText = 'Drag with 1 finger to move, 2 fingers to rotate/pinch to scale';
        placeBtn.style.display = 'none';
      });

      resetBtn.addEventListener('click', () => {
        if (!freeEntity) return;

        const targetEl = document.getElementById('target');
        freeEntity.removeAttribute('freeform-control');
        targetEl.object3D.attach(freeEntity.object3D);

        freeEntity.setAttribute('position', '0 0 0.1');
        freeEntity.setAttribute('rotation', '0 0 0');
        freeEntity.setAttribute('scale', '3 3 3');

        freeEntity = null;
        hint.innerText = 'Point camera at your marker, then tap "Place Pizza"';
        placeBtn.style.display = 'inline-block';
      });
    </script>
  </body>
</html>
