<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      /* Creates a high-contrast target framing border over the camera screen */
      .ar-scan-overlay {
        position: absolute; left: 10vw; top: 10vh; width: 80vw; height: 80vh;
        border: 4px dashed #ffffff; box-sizing: border-box; z-index: 9999; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="ar-scan-overlay"></div>
    <a-scene mindar-image="imageTargetSrc: https://jsdelivr.net;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <img id="card" src="https://jsdelivr.net" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      
        <a-box color="tomato" depth="0.2" height="0.2" width="0.2" position="0 0 0.1" animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true"></a-box>
      
    </a-scene>
  </body>
</html>
