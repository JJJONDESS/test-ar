<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: black; touch-action: none; }
    #video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    canvas { position: fixed; top: 0; left: 0; z-index: 1; }
    #startBtn {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; font-size: 16px; background: #ff5a36; color: white;
      border: none; border-radius: 8px; z-index: 9999; font-family: sans-serif;
    }
    #hint {
      position: fixed; top: 20px; left: 0; right: 0; text-align: center;
      color: white; font-family: sans-serif; font-size: 14px; text-shadow: 0 0 4px black;
      z-index: 9999; pointer-events: none;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="hint">Tap "Start" to view your pizza in AR</div>
  <button id="startBtn">Start AR</button>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    let scene, camera, renderer, pizzaModel;
    let autoSpin = true; // stops once the user starts manually rotating

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
      document.getElementById('video').srcObject = stream;
    }

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.set(0, 0, 2); // fixed camera, never moves

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(light);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(1, 1, 1);
      scene.add(dirLight);

      const loader = new THREE.GLTFLoader();
      loader.load('./pizza.glb', (gltf) => {
        pizzaModel = gltf.scene;
        pizzaModel.scale.set(1.0, 1.0, 1.0); // adjust to taste
        pizzaModel.visible = false; // hidden until the user taps to place it
        scene.add(pizzaModel);
        setupTouchControls();
        setupPlacementTap();
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function setupTouchControls() {
      const touchMap = new Map();
      let previousDistance = null;
      let dragTouchId = null;
      let lastDragPos = null;

      function getPair() { return Array.from(touchMap.values()); }
      function getDistance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

      renderer.domElement.addEventListener('touchstart', (e) => {
        e.preventDefault();
        autoSpin = false; // user has taken control
        for (const t of e.changedTouches) {
          touchMap.set(t.identifier, { x: t.clientX, y: t.clientY });
        }
        if (touchMap.size === 2) {
          const [a, b] = getPair();
          previousDistance = getDistance(a, b);
          dragTouchId = null;
        } else if (touchMap.size === 1) {
          const id = touchMap.keys().next().value;
          dragTouchId = id;
          lastDragPos = { ...touchMap.get(id) };
          previousDistance = null;
        }
      }, { passive: false });

      renderer.domElement.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (const t of e.changedTouches) {
          if (touchMap.has(t.identifier)) {
            touchMap.set(t.identifier, { x: t.clientX, y: t.clientY });
          }
        }

        if (touchMap.size === 2 && previousDistance !== null && pizzaModel) {
          const [a, b] = getPair();
          const distance = getDistance(a, b);
          let scaleFactor = distance / previousDistance;
          scaleFactor = Math.min(Math.max(scaleFactor, 0.9), 1.1); // clamp per-frame jump
          let newScale = pizzaModel.scale.x * scaleFactor;
          newScale = Math.min(Math.max(newScale, 0.3), 5); // overall size limits
          pizzaModel.scale.set(newScale, newScale, newScale);
          previousDistance = distance;
        } else if (touchMap.size === 1 && dragTouchId !== null && touchMap.has(dragTouchId) && pizzaModel) {
          const current = touchMap.get(dragTouchId);
          const dx = current.x - lastDragPos.x;
          const dy = current.y - lastDragPos.y;
          pizzaModel.rotation.y += dx * 0.01;
          pizzaModel.rotation.x += dy * 0.01;
          lastDragPos = { ...current };
        }
      }, { passive: false });

      renderer.domElement.addEventListener('touchend', (e) => {
        for (const t of e.changedTouches) {
          touchMap.delete(t.identifier);
        }
        if (touchMap.size < 2) previousDistance = null;
        if (touchMap.size !== 1) {
          dragTouchId = null;
        } else {
          dragTouchId = touchMap.keys().next().value;
          lastDragPos = { ...touchMap.get(dragTouchId) };
        }
      }, { passive: false });
    }

    let placed = false;

    function setupPlacementTap() {
      renderer.domElement.addEventListener('touchstart', (e) => {
        if (placed || e.touches.length !== 1) return;

        const touch = e.touches[0];
        // Convert the tap's screen position into normalized device coords (-1 to 1)
        const ndcX = (touch.clientX / window.innerWidth) * 2 - 1;
        const ndcY = -(touch.clientY / window.innerHeight) * 2 + 1;

        // Unproject that screen point into 3D space at a fixed distance from the camera
        const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
        vector.unproject(camera);
        const dir = vector.sub(camera.position).normalize();
        const distance = 2; // how far in front of the camera to place it, in meters
        const targetPos = camera.position.clone().add(dir.multiplyScalar(distance));

        pizzaModel.position.copy(targetPos);
        pizzaModel.visible = true;
        placed = true;
        document.getElementById('hint').innerText = 'Drag with 1 finger to rotate, pinch to resize';
      }, { passive: true, capture: true });
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      await startCamera();
      initThree();
      animate();
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('hint').innerText = 'Tap anywhere on the screen to place your pizza';
    });

    function animate() {
      requestAnimationFrame(animate);
      if (pizzaModel && autoSpin) {
        pizzaModel.rotation.y += 0.005;
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
