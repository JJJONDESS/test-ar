<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- Configured with your working version's exact scene settings -->
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!-- Your pizza model asset. Make sure "pizza.glb" is uploaded to your main GitHub folder -->
        <a-asset-item id="pizzaModel" src="./pizza.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Custom environment lighting so your 3D pizza looks bright and realistic -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.6" position="1 2 1"></a-light>

      
        <!-- 
          - The flat 2D plane is completely gone.
          - Your pizza is loaded here with a slow, smooth spinning animation.
          - Depending on your model's built-in size, you might need to adjust the scale numbers below.
        -->
        <a-gltf-model 
          id="pizza" 
          src="#pizzaModel" 
          rotation="0 0 0" 
          position="0 0 0.1" 
          scale="0.05 0.05 0.05" 
          animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true">
        </a-gltf-model>
      
    </a-scene>
  </body>
</html>
