<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: black; touch-action: none; }
    #video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    canvas { position: fixed; top: 0; left: 0; z-index: 1; }
    #startBtn {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; font-size: 16px; background: #ff5a36; color: white;
      border: none; border-radius: 8px; z-index: 9999; font-family: sans-serif;
    }
    #hint {
      position: fixed; top: 20px; left: 0; right: 0; text-align: center;
      color: white; font-family: sans-serif; font-size: 14px; text-shadow: 0 0 4px black;
      z-index: 9999; pointer-events: none;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="hint">Tap "Start" to enable camera & sensors, then tap the screen to place the pizza</div>
  <button id="startBtn">Start AR</button>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    let scene, camera, renderer, pizzaModel;
    let placed = false;
    let alpha0 = null, beta0 = null, gamma0 = null; // orientation offset at placement time

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
      document.getElementById('video').srcObject = stream;
    }

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(light);

      const loader = new THREE.GLTFLoader();
      loader.load('./pizza.glb', (gltf) => {
        pizzaModel = gltf.scene;
        pizzaModel.scale.set(0.3, 0.3, 0.3); // tweak to taste
        pizzaModel.visible = false;
        scene.add(pizzaModel);
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function handleOrientation(e) {
      if (!placed || !pizzaModel) return;

      // Convert device orientation to radians, offset by the reading at placement time
      const alpha = THREE.MathUtils.degToRad(e.alpha - alpha0);
      const beta = THREE.MathUtils.degToRad(e.beta - beta0);
      const gamma = THREE.MathUtils.degToRad(e.gamma - gamma0);

      // Counter-rotate the camera to simulate the model staying "fixed" in space
      camera.rotation.set(beta, alpha, -gamma, 'YXZ');
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      await startCamera();
      initThree();
      animate();

      // iOS requires an explicit permission prompt; Android generally doesn't
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }
      window.addEventListener('deviceorientation', handleOrientation);

      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('hint').innerText = 'Tap anywhere on the screen to place the pizza';
    });

    document.body.addEventListener('click', (e) => {
      if (e.target.id === 'startBtn' || !pizzaModel) return;
      if (placed) return;

      // Lock the model 1 meter in front of the camera's current facing direction
      pizzaModel.position.set(0, -0.2, -1);
      pizzaModel.visible = true;
      placed = true;

      document.getElementById('hint').innerText = 'Pizza placed! Rotate your phone to look around';
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
