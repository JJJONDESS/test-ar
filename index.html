<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: black; touch-action: none; }
    #video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    canvas { position: fixed; top: 0; left: 0; z-index: 1; }
    #startBtn {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; font-size: 16px; background: #ff5a36; color: white;
      border: none; border-radius: 8px; z-index: 9999; font-family: sans-serif;
    }
    #hint {
      position: fixed; top: 20px; left: 0; right: 0; text-align: center;
      color: white; font-family: sans-serif; font-size: 14px; text-shadow: 0 0 4px black;
      z-index: 9999; pointer-events: none;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="hint">Tap "Start" to enable camera & sensors, then tap the screen to place the pizza</div>
  <button id="startBtn">Start AR</button>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    let scene, camera, renderer, pizzaModel;
    let placed = false;

    // Raw incoming readings
    let rawAlpha = 0, rawBeta = 0, rawGamma = 0;
    // Smoothed readings actually used for rendering
    let smoothAlpha = 0, smoothBeta = 0, smoothGamma = 0;
    const smoothingFactor = 0.15; // lower = smoother but laggier, higher = snappier but jumpier

    let deviceAlpha = 0, deviceBeta = 0, deviceGamma = 0;
    let screenOrientAngle = 0;

    // Reusable objects for the orientation math (avoids creating garbage every frame)
    const zee = new THREE.Vector3(0, 0, 1);
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // -90deg around X

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
      document.getElementById('video').srcObject = stream;
    }

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(light);

      const loader = new THREE.GLTFLoader();
      loader.load('./pizza.glb', (gltf) => {
        pizzaModel = gltf.scene;
        pizzaModel.scale.set(1.0, 1.0, 1.0); // bumped up from 0.3 — adjust further if still off
        pizzaModel.visible = false;
        scene.add(pizzaModel);
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // Standard, correct alpha/beta/gamma -> quaternion conversion
    function applyDeviceOrientationToCamera() {
      const alpha = THREE.MathUtils.degToRad(deviceAlpha);
      const beta = THREE.MathUtils.degToRad(deviceBeta);
      const gamma = THREE.MathUtils.degToRad(deviceGamma);
      const orient = THREE.MathUtils.degToRad(screenOrientAngle);

      euler.set(beta, alpha, -gamma, 'YXZ');
      camera.quaternion.setFromEuler(euler);
      camera.quaternion.multiply(q1);
      camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
    }

    function handleOrientation(e) {
      if (e.alpha === null) return; // some devices briefly fire null readings
      rawAlpha = e.alpha;
      rawBeta = e.beta;
      rawGamma = e.gamma;

      // Exponential smoothing to reduce sensor jitter/noise
      smoothAlpha += (rawAlpha - smoothAlpha) * smoothingFactor;
      smoothBeta += (rawBeta - smoothBeta) * smoothingFactor;
      smoothGamma += (rawGamma - smoothGamma) * smoothingFactor;

      deviceAlpha = smoothAlpha;
      deviceBeta = smoothBeta;
      deviceGamma = smoothGamma;
    }

    function handleScreenOrientation() {
      screenOrientAngle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      await startCamera();
      initThree();
      handleScreenOrientation();
      animate();

      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }
      window.addEventListener('deviceorientation', handleOrientation);
      window.addEventListener('orientationchange', handleScreenOrientation);

      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('hint').innerText = 'Tap anywhere on the screen to place the pizza';
    });

    document.body.addEventListener('click', (e) => {
      if (e.target.id === 'startBtn' || !pizzaModel || placed) return;

      // Figure out which way the camera is currently facing, in world space,
      // and drop the model there PERMANENTLY (fixed world position).
      const forward = new THREE.Vector3(0, 0, -1);
      forward.applyQuaternion(camera.quaternion);
      forward.multiplyScalar(1.2); // distance in front of camera, in meters

      pizzaModel.position.copy(camera.position).add(forward);
      pizzaModel.position.y -= 0.2; // drop it slightly lower, like on a table
      pizzaModel.visible = true;
      placed = true;

      document.getElementById('hint').innerText = 'Pizza placed! Rotate your phone to look around';
    });

    function animate() {
      requestAnimationFrame(animate);
      applyDeviceOrientationToCamera();

      // Slow constant spin so the model's 3D depth/sides are visible
      // even if you're standing still and only turning the phone.
      if (pizzaModel && placed) {
        pizzaModel.rotation.y += 0.005;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
