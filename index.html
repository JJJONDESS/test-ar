<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Core frameworks for WebXR and Augmented Reality tracking -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body>
    <!-- 
      AR Scene Configuration:
      - physicallyCorrectLights and colorManagement ensure the 3D pizza textures reflect light realistically.
    -->
    <a-scene 
      mindar-image="imageTargetSrc: https://jsdelivr.net;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 
          Your 3D Pizza Asset:
          Remember to change "./pizza.glb" to match your exact file name when you upload it to GitHub!
        -->
        <a-asset-item id="pizzaModel" src="./pizza.glb"></a-asset-item>
      </a-assets>

      <!-- Camera system required for WebAR viewport -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Realistic Lighting setup to blend the 3D object into the real world environment -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.6" position="1 2 1"></a-light>
      
      <!-- 
        Image Tracking Target:
        - The 2D plane is completely gone.
        - The pizza is set to rotate 360 degrees smoothly on a loop.
        - Tweak scale="0.05 0.05 0.05" up or down depending on how large your downloaded model is.
      -->
      
        <a-gltf-model 
          id="pizza"
          src="#pizzaModel" 
          rotation="0 0 0" 
          position="0 0 0.1" 
          scale="0.05 0.05 0.05" 
          animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true">
        </a-gltf-model>
      
    </a-scene>
  </body>
</html>
